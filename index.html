<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Universo Mariana</title>

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/background.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/hero.css" />
  </head>

  <body>
    <div id="background">
      <div id="nebula"></div>
      <div id="stars-small"></div>
      <div id="stars-medium"></div>
      <div id="stars-big"></div>
      <div id="meteors"></div>

      <div class="meteor">
        <div class="meteor-head"></div>

        <div class="meteor-tail"></div>
      </div>
    </div>

    <main id="app">
      <section id="hero">
        <div class="hero-content">
          <p id="typing" aria-live="polite"></p>

          <button id="enterButton" type="button" disabled>
            ✨ Começar a viagem
          </button>
        </div>
      </section>

      <section id="journey">
        <div class="journey-content">
          <span class="journey-label"> Capítulo II </span>

          <h2>Onde a nossa história começa</h2>

          <p>Algumas pessoas chegam devagar. Outras mudam todo o universo.</p>
        </div>
      </section>
    </main>

    <script src="js/background.js"></script>
    <script src="js/meteor.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/typing.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
