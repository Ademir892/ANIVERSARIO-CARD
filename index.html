<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Universo Mariana</title>

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/background.css" />
    <link rel="stylesheet" href="css/hero.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/journey.css" />
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/animations.css" />
  </head>

  <body>
    <div id="background">
      <div id="nebula"></div>
      <div id="stars-small"></div>
      <div id="stars-medium"></div>
      <div id="stars-big"></div>
      <div id="meteors"></div>

      <div class="meteor">
        <div class="meteor-head"></div>

        <div class="meteor-tail"></div>
      </div>
    </div>

    <main id="app">
      <section id="hero">
        <div class="hero-content">
          <p id="typing" aria-live="polite"></p>

          <button id="enterButton" type="button" disabled>
            ✨ Começar a viagem
          </button>
        </div>
      </section>

      <section id="journey">
        <div id="memoryModal" class="memory-modal" aria-hidden="true">
          <div class="memory-modal__backdrop" data-modal-close></div>

          <article
            class="memory-modal__dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="memoryModalTitle"
            tabindex="-1"
          >
            <button
              class="memory-modal__close"
              type="button"
              aria-label="Fechar janela"
              data-modal-close
            >
              <span aria-hidden="true">×</span>
            </button>

            <p class="memory-modal__eyebrow">Arquivo encontrado</p>

            <h2 id="memoryModalTitle">Explorando planeta...</h2>

            <div id="memoryModalContent" class="memory-modal__content"></div>
          </article>
        </div>
        <div class="galaxy">
          <div class="galaxy-introduction">
            <p class="galaxy-eyebrow">Universo Mariana</p>

            <h2>Uma galáxia cheia de descobertas</h2>

            <p>
              Cada mundo guarda uma parte do nosso caos, das nossas piadas e da
              história que ainda estamos escrevendo.
            </p>
          </div>

          <div class="planet-system">
            <button
              class="planet planet-manual"
              type="button"
              data-memory="manual"
              aria-label="Abrir Manual da Mariana"
            >
              <span class="planet-body"></span>
              <span class="planet-label"> Manual da Mariana </span>
            </button>

            <button
              class="planet planet-bugs"
              type="button"
              data-memory="bugs"
              aria-label="Abrir Bugs conhecidos"
            >
              <span class="planet-body"></span>
              <span class="planet-label"> Bugs conhecidos </span>
            </button>

            <button
              class="planet planet-achievements"
              type="button"
              data-memory="achievements"
              aria-label="Abrir Conquistas desbloqueadas"
            >
              <span class="planet-body"></span>
              <span class="planet-ring"></span>

              <span class="planet-label"> Conquistas </span>
            </button>

            <button
              class="planet planet-missions"
              type="button"
              data-memory="missions"
              aria-label="Abrir Missões futuras"
            >
              <span class="planet-body"></span>
              <span class="planet-label"> Missões futuras </span>
            </button>

            <button
              class="planet planet-terminal"
              type="button"
              data-memory="terminal"
              aria-label="Abrir Terminal do amor"
            >
              <span class="planet-body"></span>
              <span class="planet-orbit"></span>
              <span class="planet-moon"></span>

              <span class="planet-label"> Terminal do amor </span>
            </button>

            <button
              class="planet planet-message"
              type="button"
              data-memory="message"
              aria-label="Abrir mensagem especial"
            >
              <span class="planet-body"></span>
              <span class="planet-label"> Para você </span>
            </button>
          </div>

          <p class="galaxy-hint">Escolha um planeta para explorar.</p>
        </div>
      </section>
    </main>

    <script src="js/background.js"></script>
    <script src="js/meteor.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/typing.js"></script>
    <script src="js/journey.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
